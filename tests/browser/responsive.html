<!doctype html><html lang="ja"><meta charset="utf-8"><title>Studio レイアウト検証</title>
<style>body{margin:0;font:18px/1.5 system-ui;background:#f3eee3}header{padding:16px}select{font:inherit;min-height:48px}#viewport{overflow:auto;max-width:100%}iframe{border:0;display:block;transform-origin:top left}pre{font-size:16px;white-space:pre-wrap}</style>
<header><label>表示条件 <select id="size"><option value="1265,713,1">通常 1265px</option><option value="1012,570,1.25">125%相当</option><option value="843,475,1.5">150%相当</option><option value="632,356,2">200%相当</option><option value="360,740,1">狭幅 360px</option></select></label> <label>画面 <select id="page"><option value="#character/warrior">重装戦士</option><option value="#gallery">ギャラリー</option><option value="dungeon">8×8ダンジョン</option></select></label><p>iframeのCSS viewportと描画倍率による拡大相当試験。ブラウザ本体のズーム設定ではありません。</p><pre id="result"></pre></header><div id="viewport"><iframe title="Studio検証画面" src="../../index.html#character/warrior"></iframe></div>
<script>
const frame=document.querySelector('iframe'),size=document.querySelector('#size');
function measure(){const d=frame.contentDocument;if(!d?.querySelector('main'))return;const visible=[...d.querySelectorAll('button,a,select,input')].filter(e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height);document.querySelector('#result').textContent=JSON.stringify({condition:size.selectedOptions[0].textContent,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,bodyFont:frame.contentWindow.getComputedStyle(d.body).fontSize,minButtonHeight:Math.min(...visible.filter(e=>e.tagName==='BUTTON').map(e=>e.getBoundingClientRect().height)),horizontalOverflow:visible.filter(e=>e.getBoundingClientRect().left<-.5||e.getBoundingClientRect().right>d.documentElement.clientWidth+.5).map(e=>e.textContent.trim())},null,2);}
function resize(){const[w,h,z]=size.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`scale(${z})`;document.querySelector('#viewport').style.height=h*z+'px';setTimeout(measure,300);}
size.onchange=resize;document.querySelector('#page').onchange=e=>{frame.src=e.target.value==='dungeon'?'../../game/index.html':'../../index.html'+e.target.value;};frame.onload=()=>{resize();setTimeout(measure,700);};resize();
</script></html>
